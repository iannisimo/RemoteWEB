<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemoteWEB demo</title>
<style>
  body { margin: 0; font: 18px system-ui, sans-serif; background: #111; color: #eee; display: flex; height: 100vh; }
  .leftbar { width: 200px; background: #1c1c1c; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .leftbar a { color: #eee; text-decoration: none; padding: 10px; border-radius: 6px; }
  .leftbar a:focus { background: #3d9eff; color: #000; outline: none; } /* site's own focus style */
  .tab { font-size: 18px; padding: 14px 30px; margin-right: 10px; background: #333; color: #eee; border: 0; border-radius: 6px; }
  .tab.is-focused { background: #e0e0e0; color: #000; } /* added by JS, a moment after focus */
  main { flex: 1; padding: 20px; overflow: auto; }
  input { font-size: 18px; padding: 8px; width: 300px; margin-bottom: 20px; }
  /* Plain divs, no tabindex: a typical "not made for keyboards" grid */
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  #grid > div { background: #2a2a2a; height: 140px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; }
  #modal { position: fixed; inset: 25% 30%; background: #333; padding: 30px; border-radius: 10px; display: none; }
  #modal.open { display: block; }
  .row-wrap { display: flex; align-items: flex-start; gap: 10px; margin-top: 30px; }
  #row { width: 600px; display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; }
  #row > button { flex: 0 0 250px; height: 100px; font-size: 18px; background: #2a3a4a; color: #eee; border: 0; border-radius: 8px; }
  .see-all { height: 100px; font-size: 18px; opacity: 0; } /* only visible on hover */
  .row-wrap:hover .see-all { opacity: 1; }
  #log { margin-top: 20px; color: #8c8; }
</style>
</head>
<body>
  <nav class="leftbar">
    <a href="#home">Home</a>
    <a href="#movies">Movies</a>
    <a href="#series">Series</a>
    <a href="#settings">Settings</a>
  </nav>
  <main>
    <input id="search" placeholder="Search…">
    <div id="grid"></div>
    <h3>Continue watching</h3>
    <div class="row-wrap">
      <div id="row"></div>
      <button class="see-all">See all</button>
    </div>
    <h3>Web component (shadow DOM)</h3>
    <shadow-panel></shadow-panel>
    <h3>Tabs (focus style added by JS after a delay)</h3>
    <div class="tabs"><button class="tab">Tab A</button><button class="tab">Tab B</button></div>
    <div id="log"></div>
  </main>
  <div id="modal" aria-modal="true" role="dialog">
    <p id="modal-title"></p>
    <button class="play">Play</button>
    <button class="close">Close</button>
  </div>
<script>
  const grid = document.getElementById('grid');
  const modal = document.getElementById('modal');
  for (let i = 1; i <= 16; i++) {
    const d = document.createElement('div');
    d.innerHTML = '<span>Item ' + i + '</span>'; // the span inherits cursor:pointer and must not count
    d.addEventListener('click', () => {
      document.getElementById('modal-title').textContent = 'Item ' + i;
      modal.classList.add('open');
    });
    grid.appendChild(d);
  }
  const row = document.getElementById('row');
  for (let i = 1; i <= 6; i++) {
    const b = document.createElement('button');
    b.textContent = 'Card ' + i;
    row.appendChild(b);
  }
  for (const t of document.querySelectorAll('.tab')) {
    t.addEventListener('focus', () => setTimeout(() => t.classList.add('is-focused'), 60));
    t.addEventListener('blur', () => t.classList.remove('is-focused'));
  }
  // Fake video player shortcut: K toggles pause (checks keyCode, like many real sites)
  window.paused = false; window.kCount = 0;
  document.addEventListener('keydown', (e) => { if (e.keyCode === 75 && e.key === 'k') { window.paused = !window.paused; window.kCount++; } });
  row.children[0].addEventListener('mouseenter', () => row.children[0].dataset.hovered = 'yes');
  customElements.define('shadow-panel', class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' }).innerHTML =
        '<style>button{font-size:18px;padding:20px 40px;margin-right:16px}</style>' +
        '<button id="sa">Shadow A</button><button id="sb">Shadow B</button>';
    }
  });
  modal.querySelector('.close').addEventListener('click', () => modal.classList.remove('open'));
</script>
<script src="remoteweb.user.js"></script>
